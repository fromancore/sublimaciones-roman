# ============================================================
# CI Pipeline - Sublimaciones Roman
# Estándar: ISO/IEC/IEEE 12207 — Proceso de Integración
# ============================================================
# Descripción: Pipeline de Integración Continua completo.
# Ejecuta verificaciones de calidad, build y tests en cada
# Push a main/develop y en cada Pull Request.
# ============================================================

name: 🚀 CI — Integración Continua

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened, ready_for_review]

# Cancelar ejecuciones anteriores del mismo PR para ahorrar recursos
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos requeridos (principio de mínimo privilegio)
permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  NODE_VERSION: '20.x'
  NODE_ENV: 'test'

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Verificación de Calidad de Código
  # Proceso ISO 12207: Verificación (6.4.6)
  # ─────────────────────────────────────────────
  quality:
    name: 🔍 Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para análisis de historial completo

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Instalar dependencias (CI mode)
        run: npm ci --prefer-offline
        # npm ci garantiza instalación reproducible (lock file estricto)

      - name: 🔎 Verificar convención de Conventional Commits
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: '.commitlintrc.json'
        continue-on-error: false

      - name: 🧹 ESLint — Análisis estático de código
        run: npm run lint
        env:
          CI: true

      - name: 📐 Prettier — Verificación de formato
        run: npm run format:check

  # ─────────────────────────────────────────────
  # JOB 2: Build y Compilación
  # Proceso ISO 12207: Implementación del Software (6.4.5)
  # ─────────────────────────────────────────────
  build:
    name: 🏗️ Build & Bundle
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci --prefer-offline

      - name: 🏗️ Build de producción con Vite
        run: npm run build
        env:
          CI: true
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_BUILD_DATE: ${{ github.run_id }}

      - name: 📊 Reporte de tamaño del bundle
        uses: andresz1/size-limit-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true  # No bloquea el pipeline, solo informa

      - name: 📤 Subir artefacto de build
        uses: actions/upload-artifact@v4
        with:
          name: dist-build-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # JOB 3: Pruebas Automatizadas
  # Proceso ISO 12207: Pruebas del Software (6.4.9)
  # ─────────────────────────────────────────────
  test:
    name: 🧪 Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: ['18.x', '20.x']  # Verificar compatibilidad multi-versión
      fail-fast: false

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci --prefer-offline

      - name: 🧪 Ejecutar suite de pruebas con Vitest
        run: npm run test:coverage
        env:
          CI: true

      - name: 📊 Publicar reporte de cobertura
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unit-tests
          name: coverage-node-${{ matrix.node-version }}
          fail_ci_if_error: false
          verbose: true

      - name: 📤 Subir reporte de cobertura como artefacto
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage/
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 4: Resumen de Estado del Pipeline
  # Proceso ISO 12207: Aseguramiento de la Calidad (6.4.8)
  # ─────────────────────────────────────────────
  ci-status:
    name: ✅ Pipeline Status Summary
    runs-on: ubuntu-latest
    needs: [quality, build, test]
    if: always()  # Ejecuta siempre, incluso si jobs anteriores fallan

    steps:
      - name: 🔍 Evaluar resultado del pipeline
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}

      - name: 💬 Comentar resultado en PR (en caso de fallo)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('<!-- ci-status-comment -->')
            );
            const body = `<!-- ci-status-comment -->
            ## ❌ Pipeline de CI Fallido

            El pipeline de CI ha detectado errores en este Pull Request.
            Por favor, revisa los logs y corrige los problemas antes de hacer merge.

            | Job | Estado |
            |-----|--------|
            | 🔍 Lint & Format | ${{ needs.quality.result }} |
            | 🏗️ Build | ${{ needs.build.result }} |
            | 🧪 Tests | ${{ needs.test.result }} |

            > **Commit:** \`${{ github.sha }}\`
            > **Ejecutado:** ${new Date().toISOString()}

            [Ver detalles del pipeline](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
